steps:
  - id: 'image-build'
    name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/verdant/verdant-api'
      - '--cache=true'
      - '--cache-repo=${_REGION}-docker.pkg.dev/$PROJECT_ID/verdant/verdant-api/cache'
      - '--cache-ttl=168h'
      - '--custom-platform=linux/amd64'
      - '--snapshot-mode=redo'
      - '--ignore-path=/tmp/hsperfdata_root'
      - '--use-new-run'
      - '--build-arg=VITE_GOOGLE_CLIENT_ID'
    secretEnv:
      - 'VITE_GOOGLE_CLIENT_ID'

  - id: 'deploy'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['image-build']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail

        # The Cloud SQL instance is deliberately NOT defaulted. It used to be
        # hardcoded to staging, so a build submitted against any other project
        # would deploy that project's image pointed at the staging database.
        if [ -z "${_SQL_INSTANCE}" ]; then
          echo "ERROR: _SQL_INSTANCE substitution is required (PROJECT:REGION:INSTANCE)." >&2
          echo "       e.g. --substitutions=_SQL_INSTANCE=verdant-prod:europe-north1:verdant-prod" >&2
          exit 1
        fi

        gcloud run deploy ${_SERVICE} \
          --region=${_REGION} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/verdant/verdant-api \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --memory=${_MEMORY} \
          --cpu=1 \
          --min-instances=${_MIN_INSTANCES} \
          --max-instances=${_MAX_INSTANCES} \
          --set-cloudsql-instances=${_SQL_INSTANCE} \
          --set-env-vars="DB_USERNAME=${_DB_USER},GCS_BUCKET=${_GCS_BUCKET},DB_URL=jdbc:postgresql:///${_DB_NAME}?cloudSqlInstance=${_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory" \
          --set-secrets="DB_PASSWORD=verdant-db-password:latest,GEMINI_API_KEY=verdant-gemini-key:latest,ADMIN_PASSWORD=verdant-admin-password:latest,JWT_PRIVATE_KEY=verdant-jwt-private-key:latest,JWT_PUBLIC_KEY=verdant-jwt-public-key:latest,GOOGLE_CLIENT_ID=verdant-google-client-id:latest"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/verdant-google-client-id/versions/latest
      env: 'VITE_GOOGLE_CLIENT_ID'

# Every environment-specific value lives here. _SQL_INSTANCE has no default
# on purpose: see the guard in the deploy step.
substitutions:
  _REGION: 'europe-north1'
  _SERVICE: 'verdant-api'
  _SQL_INSTANCE: ''
  _DB_NAME: 'verdant'
  _DB_USER: 'verdant'
  # Each project owns its bucket; photo URLs are absolute under this name.
  _GCS_BUCKET: 'verdant-prod-media'
  _MEMORY: '512Mi'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '3'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
